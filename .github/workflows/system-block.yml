name: Build System Wide Block Browser
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :systemblock:testDebugUnitTest :systemblock:assembleDebug :systemblock:lintDebug
      - name: Print lint findings on failure
        if: failure()
        run: cat systemblock/build/reports/lint-results-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: System-Wide-Block-Browser-debug
          path: systemblock/build/outputs/apk/debug/*.apk
